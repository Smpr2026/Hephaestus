<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6142">
<meta name="description" content="Bistro on the Lawns — order to your table at Campsie South. Starters, grills, pasta, burgers and more.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bistro on the Lawns">
<title>Bistro on the Lawns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Palette lifted from the printed menu: bottle green on white,
       with the two green fills used for its table rows. */
    --ink:#14311f; --paper:#ffffff; --cream:#f4f9f5;
    --green-900:#0f3823; --green-800:#17492f; --green:#1f6142; --green-600:#2e7a54;
    --green-400:#7fb495; --green-300:#a9cdb6; --green-200:#cfe5d7; --green-100:#e8f3eb;
    --n700:#4a5c51; --n600:#6b7c71; --n500:#8a9a90; --n400:#b6c3bb; --n300:#d6e0d9;
    --line:rgba(20,49,31,.13);
    --display:'Alfa Slab One', Georgia, serif;
    --cond:'Barlow Condensed', 'Barlow', system-ui, sans-serif;
    --body:'Barlow', system-ui, -apple-system, sans-serif;
    --stage:#dce9e0; --stage-ink:#4a5c51;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --stage:#12241a; --stage-ink:#8a9a90; }
  }
  :root[data-theme="dark"]{ --stage:#12241a; --stage-ink:#8a9a90; }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--stage); color:var(--ink); font-family:var(--body);
    -webkit-font-smoothing:antialiased; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:28px 16px;
  }
  .stage-note{font-size:12.5px; color:var(--stage-ink); text-align:center; max-width:402px; line-height:1.5}
  .stage-note b{font-weight:700}

  .device{
    width:402px; height:874px; max-width:100%; border-radius:48px; overflow:hidden;
    position:relative; background:var(--paper); flex:none;
    box-shadow:0 40px 80px rgba(15,56,35,.22), 0 0 0 1px rgba(15,56,35,.14);
  }
  @media (max-height:940px){ .device{height:min(874px, calc(100vh - 120px))} }
  .island{position:absolute; top:11px; left:50%; transform:translateX(-50%); width:126px; height:37px; border-radius:24px; background:#000; z-index:50}
  .statusbar{position:absolute; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; justify-content:center; gap:154px; padding:21px 24px 19px; pointer-events:none}
  .statusbar .time{flex:1; text-align:center; font-family:-apple-system,'SF Pro',system-ui; font-weight:590; font-size:17px; line-height:22px; color:#000}
  .statusbar .icons{flex:1; display:flex; align-items:center; justify-content:center; gap:7px}
  .homebar{position:absolute; bottom:0; left:0; right:0; z-index:60; height:34px; display:flex; justify-content:center; align-items:flex-end; padding-bottom:8px; pointer-events:none}
  .homebar i{display:block; width:139px; height:5px; border-radius:100px; background:rgba(0,0,0,.25)}

  .app{height:100%; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); position:relative}
  .scroll{flex:1; overflow:auto; min-height:0; -webkit-overflow-scrolling:touch}
  .screen{padding:72px 18px 132px}

  .d1{font-family:var(--display); font-size:21px; line-height:1.15; letter-spacing:.01em}
  .d2{font-family:var(--display); font-size:18px; line-height:1.2}
  .sect{
    font-family:var(--display); font-size:17px; color:var(--green);
    border-bottom:2.5px solid var(--green); padding-bottom:5px; margin-bottom:2px;
    text-transform:uppercase; letter-spacing:.02em;
  }
  .kicker{font-family:var(--cond); font-size:12.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--n600)}

  button{font-family:var(--body); cursor:pointer}
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--green); outline-offset:2px; border-radius:8px}
  .pill{border:none; border-radius:999px; display:inline-flex; align-items:center; justify-content:center}
  .card{background:var(--paper); border:1.5px solid var(--green-200); border-radius:14px}
  .row{display:flex; align-items:center}

  .primary{
    width:100%; border:none; background:var(--green); color:#fff; border-radius:10px;
    padding:16px; font-weight:700; font-size:16px; letter-spacing:.01em;
    box-shadow:0 3px 10px rgba(15,56,35,.2); transition:background .15s;
  }
  .primary:hover{background:var(--green-600)} .primary:active{background:var(--green-800)}

  .item{display:flex; align-items:flex-start; gap:12px; padding:13px 0; width:100%; border:none; background:none; text-align:left; border-bottom:1px solid var(--line); cursor:pointer}
  .item:hover{background:var(--cream)}
  .tagpill{display:inline-block; font-family:var(--cond); font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--green); border:1.5px solid var(--green-300); border-radius:4px; padding:0 5px; margin-left:5px; vertical-align:1px}
  .addbtn{width:34px; height:34px; border-radius:8px; border:none; background:var(--green); color:#fff; font-size:20px; line-height:1; flex:none; display:flex; align-items:center; justify-content:center; padding-bottom:2px}
  .addbtn:active{background:var(--green-800)}
  .flag{display:inline-flex; align-items:center; gap:5px; margin-top:5px; background:var(--green-100); color:var(--green-800); border:1px solid var(--green-300); border-radius:5px; padding:3px 8px; font-size:11.5px; font-weight:700}
  .price{font-family:var(--cond); font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; text-align:right; min-width:44px}

  .stepper{display:flex; align-items:center; gap:9px; background:var(--green-100); border-radius:8px; padding:4px}
  .stepper button{width:28px; height:28px; border-radius:6px; border:none; background:var(--paper); font-size:16px; color:var(--green-800)}
  .stepper span{font-weight:700; font-size:14px; min-width:14px; text-align:center; font-variant-numeric:tabular-nums}
  .chip{border-radius:8px; font-weight:700; cursor:pointer; border:none; font-size:14px; font-family:var(--cond)}
  .toggle{border-radius:8px; padding:8px 13px; font-size:13px; font-weight:600; font-family:var(--body); cursor:pointer}

  .overlay{position:absolute; inset:0; background:rgba(15,56,35,.45); z-index:40; display:flex; flex-direction:column; justify-content:flex-end}
  .sheet{background:var(--paper); border-radius:18px 18px 0 0; padding:22px 20px 38px; animation:bsheet .25s ease-out; max-height:80%; overflow:auto}
  .toast{position:absolute; left:50%; bottom:120px; transform:translateX(-50%); background:var(--green-900); color:#fff; border-radius:8px; padding:11px 18px; font-size:13px; font-weight:600; z-index:50; max-width:88%; text-align:center; animation:btoast .22s ease-out; box-shadow:0 12px 32px rgba(15,56,35,.35)}
  .cartbar{position:absolute; left:14px; right:14px; bottom:104px; z-index:30}
  .nav{flex:none; display:flex; background:var(--paper); border-top:1.5px solid var(--green-200); padding:10px 6px 30px; z-index:20}
  .nav button{flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; position:relative}
  .nav span{font-family:var(--cond); font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase}
  .badge{position:absolute; top:0; right:22%; width:8px; height:8px; border-radius:999px; background:var(--green)}

  .floor{margin-top:12px; position:relative; height:400px; border-radius:14px; background:var(--green-100); border:1.5px solid var(--green-200); overflow:hidden}
  .zone{position:absolute; border-radius:10px; background:var(--green-200)}
  .tabledot{position:absolute; transform:translate(-50%,-50%); width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:var(--cond); font-size:13px; font-weight:700; box-shadow:0 1px 3px rgba(15,56,35,.25)}
  .runner{transition:left .6s linear, top .6s linear}

  @keyframes bpulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.4);opacity:0}}
  @keyframes btoast{from{transform:translate(-50%,14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  @keyframes bsheet{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .pulse{animation:bpulse 1.7s ease-out infinite}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important}}
  ::selection{background:var(--green-200)}

  @media (max-width: 700px){
    body{display:block; padding:0; gap:0; background:var(--paper); min-height:auto}
    .stage-note{display:none}
    .device{width:100%; max-width:none; border-radius:0; box-shadow:none; height:100vh; height:100dvh}
    .island, .statusbar, .homebar{display:none}
    .screen{padding-top:calc(env(safe-area-inset-top, 0px) + 18px)}
    .nav{padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 12px)}
    .cartbar{bottom:calc(env(safe-area-inset-bottom, 0px) + 86px)}
    .toast{bottom:calc(env(safe-area-inset-bottom, 0px) + 104px)}
    .addbtn{width:42px; height:42px; font-size:23px}
    .item{padding:15px 0}
    .stepper button{width:34px; height:34px}
  }
</style>
</head>

        lineStr:fmt(P(it)*l.qty) }; });
      S.order = {num:'#50', items:oi, total:subtotal, mode:S.mode, table:S.table, progress:0,

        +  '<div style="font-size:12.5px;color:var(--green-800)">Bringing it to table ' + o.table + ' now</div></div>'

      +  '<div style="font-size:12px;color:var(--n500);margin-top:2px">Flags dishes and goes to the kitchen with every order</div></div>'
      +  '<button ' + on(()=>{ S.dietSheet = true; render(); }) + ' class="pill" style="border:none;border-radius:8px;background:var(--green-100);color:var(--green-800);padding:9px 13px;font-family:var(--cond);font-weight:700;font-size:13px;text-transform:uppercase">Edit</button></div>';

    h += '<div class="sect" style="margin:20px 0 8px">Recent visits</div><div class="card" style="padding:2px 15px">';
    HISTORY.forEach(ho => {
      h += '<div class="row" style="gap:10px;padding:12px 0;border-bottom:1px solid var(--line)">'
        +  '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">' + esc(ho.what) + '</div>'
        +  '<div style="font-size:12px;color:var(--n500);margin-top:1px">' + esc(ho.when) + '</div></div>'
        +  '<span style="font-size:13.5px;font-weight:700;color:var(--n600);font-variant-numeric:tabular-nums">' + ho.total + '</span></div>';
    });
    h += '</div>';

    h += '<div class="card" style="margin-top:14px;padding:2px 15px">'
      +  '<div class="row" style="padding:14px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:500">Payment methods<span style="margin-left:auto;color:var(--n400)">›</span></div>'
      +  '<div class="row" style="padding:14px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:500">Notifications<span style="margin-left:auto;color:var(--n400)">›</span></div>'
      +  '<div ' + on(()=>{ S.screen='kitchen'; render(); }) + ' role="button" tabindex="0" class="row" style="padding:14px 0;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--green)">Kitchen pass — staff view<span style="margin-left:auto;color:var(--n400)">›</span></div></div>';
    return h + '</div>';
  }

  /* ── chrome ───────────────────────────────────────────── */
  function chrome(){
    const o = S.order;
    const count = S.lines.reduce((a,l)=>a+l.qty,0);
    const subtotal = S.lines.reduce((a,l)=>a+P(findItem(l.id))*l.qty,0);
    let h = '';

    if (S.screen==='menu' && count>0){
      h += '<div class="cartbar"><button ' + on(()=>{ S.screen='cart'; render(); })
        +  ' style="width:100%;border:none;background:var(--green-900);color:#fff;border-radius:10px;padding:15px 20px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;box-shadow:0 10px 28px rgba(15,56,35,.3)">'
        +  '<span>View order · ' + count + ' item' + (count===1?'':'s') + '</span><span>' + fmt(subtotal) + '</span></button></div>';
    }

    h += '<div class="nav">';
    TAB_DEFS.forEach(t => {
      const active = S.screen===t.id || (t.id==='me'&&S.screen==='kitchen') || (t.id==='menu'&&S.screen==='cart');
      const badge = t.id==='track' && !!o && o.progress<1;
      h += '<button ' + on(()=>{ S.screen=t.id; render(); }) + ' style="color:' + (active?'var(--green)':'var(--n500)') + '"'
        +  (active?' aria-current="page"':'') + '>'
        +  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + t.d1 + '"></path><path d="' + t.d2 + '"></path></svg>'
        +  '<span>' + t.label + '</span>' + (badge?'<span class="badge"></span>':'') + '</button>';
    });
    h += '</div>';

    if (S.itemSheet){
      const it = findItem(S.itemSheet);
      const editing = S.editLine !== null;
      const conf = conflictsFor(it, S.sheetSel);
      const had = conflictsFor(it, []).length > 0;
      const warn = conf.length
        ? 'Contains ' + conf.join(' & ').toLowerCase() + ' — your profile flags this. Pick a change below or skip it.'
        : (had ? 'Sorted — safe with your changes.' : '');
      h += '<div class="overlay" ' + on(()=>{ S.itemSheet=null; S.editLine=null; render(); }) + '>'
        +  '<div class="sheet" ' + on(e=>e.stopPropagation()) + '>'
        +  '<div class="row" style="align-items:baseline;justify-content:space-between;gap:10px">'
        +  '<div class="d2" style="flex:1">' + esc(it.name) + '</div><div class="price" style="font-size:17px">' + fmt(P(it)) + '</div></div>'
        +  '<div style="font-size:13px;color:var(--n600);margin-top:3px;line-height:1.45">' + esc(it.desc) + '</div>';
      if (warn)
        h += '<div style="display:flex;gap:8px;align-items:flex-start;margin-top:11px;background:var(--green-100);border:1px solid ' + (conf.length?'var(--green-400)':'var(--green-300)')
          +  ';color:var(--green-800);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.4">'
          +  '<span style="flex:none;margin-top:1px;display:flex">' + warnSvg('currentColor',14) + '</span><span>' + esc(warn) + '</span></div>';

      h += '<div class="kicker" style="margin:15px 0 8px">Changes</div><div style="display:flex;flex-wrap:wrap;gap:7px">';
      it.mods.forEach(m => {
        const sel = S.sheetSel.indexOf(m.l) >= 0;
        h += '<button ' + on(()=>{ S.sheetSel = sel ? S.sheetSel.filter(x=>x!==m.l) : S.sheetSel.concat([m.l]); render(); })
          +  ' class="toggle" aria-pressed="' + sel + '" style="border:2px solid ' + (sel?'var(--green)':'var(--green-200)')
          +  ';background:' + (sel?'var(--green-100)':'var(--paper)') + ';color:' + (sel?'var(--green-800)':'var(--n700)') + '">' + esc(m.l) + '</button>';
      });
      if (!it.mods.length) h += '<div style="font-size:13px;color:var(--n600)">No changes on this one — add a note below.</div>';
      h += '</div>';

      h += '<div class="kicker" style="margin:15px 0 8px">Note for the kitchen</div>'
        +  '<input id="note" value="' + esc(S.sheetNote) + '" placeholder="e.g. severe allergy — separate prep please" '
        +  'style="width:100%;border:1.5px solid var(--green-200);background:var(--paper);border-radius:8px;padding:12px 14px;font-family:var(--body);font-size:14px;color:var(--ink);outline:none">';

      h += '<div class="row" style="gap:11px;margin-top:15px">'
        +  '<div class="stepper" style="padding:5px">'
        +  '<button aria-label="One fewer" ' + on(()=>{ S.sheetQty = Math.max(1,S.sheetQty-1); render(); }) + ' style="width:32px;height:32px;font-size:17px">−</button>'
        +  '<span style="font-size:15px;min-width:16px">' + S.sheetQty + '</span>'
        +  '<button aria-label="One more" ' + on(()=>{ S.sheetQty = S.sheetQty+1; render(); }) + ' style="width:32px;height:32px;font-size:17px">+</button></div>'
        +  '<button ' + on(()=>{
             const mods = S.sheetSel.slice(), note = S.sheetNote.trim();
             let msg;
             if (editing){
               S.lines[S.editLine] = {id:S.itemSheet, qty:S.sheetQty, mods:mods, note:note};
               msg = it.name + ' updated';
             } else {
               addLine(S.itemSheet, S.sheetQty, mods, note);
               msg = conf.length ? 'Added — contains ' + conf.join(' & ').toLowerCase() + ', kitchen flagged'
                 : (mods.length||note) ? it.name + ' added — noted for the kitchen' : it.name + ' added';
             }
             S.itemSheet=null; S.editLine=null; showToast(msg);
           }) + ' class="primary" style="flex:1;padding:14px;font-size:15px;box-shadow:none">'
        +  (editing?'Save changes · ':'Add to order · ') + fmt(P(it)*S.sheetQty) + '</button></div>'
        +  (editing ? '<button ' + on(()=>{ S.lines.splice(S.editLine,1); S.itemSheet=null; S.editLine=null; showToast(it.name + ' removed'); })
             + ' style="margin-top:10px;width:100%;border:none;background:none;color:var(--n600);font-size:13.5px;font-weight:700;padding:10px;text-decoration:underline">Remove from order</button>' : '');
      h += '</div></div>';
    }

    if (S.dietSheet){
      h += '<div class="overlay" ' + on(()=>{ S.dietSheet=false; render(); }) + '>'
        +  '<div class="sheet" ' + on(e=>e.stopPropagation()) + '>'
        +  '<div class="d2">Allergies &amp; diet</div>'
        +  '<div style="font-size:13px;color:var(--n600);margin:5px 0 13px;line-height:1.45">Pick what applies. Dishes that clash get flagged on the menu, and the kitchen sees this with every order.</div>'
        +  '<div style="display:flex;flex-wrap:wrap;gap:7px">';
      DIETS.forEach(d => {
        const sel = S.diet.indexOf(d.label) >= 0;
        h += '<button ' + on(()=>{ S.diet = sel ? S.diet.filter(x=>x!==d.label) : S.diet.concat([d.label]); render(); })
          +  ' class="toggle" aria-pressed="' + sel + '" style="padding:9px 14px;font-size:13.5px;border:2px solid ' + (sel?'var(--green)':'var(--green-200)')
          +  ';background:' + (sel?'var(--green-100)':'var(--paper)') + ';color:' + (sel?'var(--green-800)':'var(--n700)') + '">' + d.label + '</button>';
      });
      h += '</div><button ' + on(()=>{ S.dietSheet=false; render(); }) + ' class="primary" style="margin-top:15px;padding:13px;font-size:14px;box-shadow:none">Done</button></div></div>';
    }

    if (S.memberSheet){
      const typed = String(S.memberInput || '').replace(/[^0-9]/g,'');
      const valid = typed.length >= 4;
      h += '<div class="overlay" ' + on(()=>{ S.memberSheet=false; render(); }) + '>'
        +  '<div class="sheet" ' + on(e=>e.stopPropagation()) + '>'
        +  '<div class="d2">Member number</div>'
        +  '<div style="font-size:13px;color:var(--n600);margin:5px 0 14px;line-height:1.45">Enter your Campsie South membership number to get member pricing. It’s on the front of your card.</div>'
        +  '<input id="memberno" inputmode="numeric" autocomplete="off" value="' + esc(S.memberInput) + '" placeholder="e.g. 104882" '
        +  'style="width:100%;border:1.5px solid ' + (typed.length && !valid ? 'var(--green-400)' : 'var(--green-200)')
        +  ';background:var(--paper);border-radius:8px;padding:14px 15px;font-family:var(--cond);font-size:20px;font-weight:700;letter-spacing:.12em;color:var(--ink);outline:none">'
        +  (typed.length && !valid ? '<div style="font-size:12.5px;color:var(--green-800);font-weight:600;margin-top:7px">Member numbers are at least 4 digits.</div>' : '')
        +  '<button ' + on(()=>{
             const v = String(S.memberInput||'').replace(/[^0-9]/g,'');
             if (v.length < 4){ showToast('Enter at least 4 digits'); return; }
             S.memberNo = v; S.member = true; S.memberSheet = false;
             showToast('Member pricing applied · ' + maskNo(v));
           }) + ' class="primary" style="margin-top:14px;padding:14px;font-size:15px;box-shadow:none">Apply member pricing</button>'
        +  '<button ' + on(()=>{
             S.member = false; S.memberNo = ''; S.memberInput = ''; S.memberSheet = false;
             showToast('Showing guest pricing');
           }) + ' style="margin-top:9px;width:100%;border:none;background:none;color:var(--n600);font-size:13.5px;font-weight:700;padding:11px;text-decoration:underline">'
        +  (S.member ? 'Remove my number — show guest pricing' : 'Continue as a guest') + '</button>'
        +  '</div></div>';
    }

    if (S.tableSheet){
      h += '<div class="overlay" ' + on(()=>{ S.tableSheet=false; render(); }) + '>'
        +  '<div class="sheet" ' + on(e=>e.stopPropagation()) + '>'
        +  '<div class="d2">Which table are you on?</div>'
        +  '<div style="font-size:13px;color:var(--n600);margin:5px 0 14px;line-height:1.45">It’s on the little stand in the middle of your table.</div>';
      ['Dining','Terrace'].forEach(zone => {
        h += '<div class="kicker" style="margin:10px 0 7px">' + (zone==='Dining'?'Dining room':'Terrace') + '</div>'
          +  '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px">';
        TABLES.filter(t=>t.zone===zone).forEach(t => {
          const sel = S.table === t.n;
          h += '<button ' + on(()=>{ S.table=t.n; S.tableSheet=false; showToast('Set to table ' + t.n); }) + ' class="chip" style="height:42px;background:'
            + (sel?'var(--green)':'var(--green-100)') + ';color:' + (sel?'#fff':'var(--green-800)') + '">' + t.n + '</button>';
        });
        h += '</div>';
      });
      h += '</div></div>';
    }

    if (S.toast) h += '<div class="toast" role="status">' + esc(S.toast) + '</div>';
    return h;
  }

  /* ── render ───────────────────────────────────────────── */
  const scrollEl = document.getElementById('scroll');
  const chromeEl = document.getElementById('chrome');
  const tops = {};
  let last = null;

  function render(){
    if (last === S.screen) tops[S.screen] = scrollEl.scrollTop;
    const act = document.activeElement;
    const focusedId = act && act.tagName === 'INPUT' ? act.id : null;
    const caret = focusedId ? act.selectionStart : null;

    H = {}; hid = 0;
    const body =
      S.screen==='menu'    ? menuScreen()    :
      S.screen==='cart'    ? cartScreen()    :
      S.screen==='track'   ? trackScreen()   :
      S.screen==='floor'   ? floorScreen()   :
      S.screen==='kitchen' ? kitchenScreen() :
                             meScreen();
    scrollEl.innerHTML = body;
    chromeEl.innerHTML = chrome();
    scrollEl.scrollTop = last === S.screen ? (tops[S.screen]||0) : 0;
    last = S.screen;

    if (focusedId){
      const fresh = document.getElementById(focusedId);
      if (fresh){ fresh.focus(); try { fresh.setSelectionRange(caret,caret); } catch(e){} }
    }

    /* keep the active category chip in view */
    const rail = document.getElementById('catrail');
    if (rail){
      const chip = rail.querySelector('[data-cat="' + S.cat + '"]');
      if (chip) rail.scrollLeft = Math.max(0, chip.offsetLeft - 16);
    }
    /* when the category changes, start the list at the top of the rail */
    if (pendingJump){
      pendingJump = false;
      const bar = document.getElementById('catbar');
      if (bar) scrollEl.scrollTop = bar.offsetTop;
    }
  }

  function dispatch(e){
    const t = e.target.closest && e.target.closest('[data-h]');
    if (!t) return;
    if (e.type === 'keydown'){
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (t.tagName === 'BUTTON' || t.tagName === 'INPUT') return;
      e.preventDefault();
    }
    const fn = H[t.getAttribute('data-h')];
    if (fn) fn(e);
  }
  /* swipe left/right across the item pane to change category */
  let tsx = 0, tsy = 0, tracking = false;
  document.addEventListener('touchstart', e => {
    if (S.screen !== 'menu' || S.search.trim() || S.itemSheet || S.dietSheet || S.tableSheet || S.memberSheet) { tracking = false; return; }
    const pane = e.target.closest && e.target.closest('#catpane');
    if (!pane) { tracking = false; return; }
    tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; tracking = true;
  }, {passive:true});
  document.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - tsx, dy = t.clientY - tsy;
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    const cats = sections();
    const next = dx < 0 ? S.cat + 1 : S.cat - 1;
    if (next < 0 || next >= cats.length) return;
    S.cat = next; jumpToList(); render();
  }, {passive:true});

  /* arrow keys do the same on a desktop */
  document.addEventListener('keydown', e => {
    if (S.screen !== 'menu' || S.search.trim()) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const cats = sections();
    const next = e.key === 'ArrowRight' ? S.cat + 1 : S.cat - 1;
    if (next < 0 || next >= cats.length) return;
    S.cat = next; jumpToList(); render();
  });

  document.addEventListener('click', dispatch);
  document.addEventListener('keydown', dispatch);
  document.addEventListener('input', e => {
    if (e.target.id === 'note') S.sheetNote = e.target.value;
    if (e.target.id === 'memberno') S.memberInput = e.target.value;
    if (e.target.id === 'search') { S.search = e.target.value; render(); }
  });

  setInterval(() => {
    const o = S.order;
    if (!o || o.progress >= 1) return;
    o.progress = Math.min(1, o.progress + 0.014);
    const done = o.progress >= 1;
    if (S.itemSheet || S.dietSheet || S.tableSheet || S.memberSheet) return;
    if (done){ showToast('Served — enjoy!'); return; }
    if (S.screen==='track' || S.screen==='floor' || S.screen==='kitchen') render();
  }, 600);

  render();
})();
</script>
</body>
</html>
