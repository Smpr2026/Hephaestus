<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5ead8">
<meta name="description" content="Par &amp; Grill — order Mediterranean breakfast, lunch and coffee from the course and we'll bring it to you.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Par & Grill">
<title>Par &amp; Grill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
<style>
  :root{
    /* Organic design system — gold-shifted. Brand-constant inside the phone. */
    --ground:#f5ead8; --surface:#f9f4ed; --sand:#eee7db; --ink:#201e1d;
    --gold-100:#fdf6e3; --gold-200:#f7e7b8; --gold-300:#eed389;
    --gold:#b8922e; --gold-600:#997723; --gold-700:#7a5e15; --gold-800:#57430f;
    --sage-100:#f0fae1; --sage-200:#e1eecc; --sage-300:#ccdbb2; --sage-400:#aebf92;
    --sage:#7a8a5e; --sage-600:#728157; --sage-700:#56633f; --sage-800:#3d472b;
    --n300:#dcd3c4; --n400:#c0b6a5; --n500:#a19786; --n600:#82796a; --n700:#645c50; --n800:#474238; --n900:#2e2b25;
    /* Page surround — the only thing that answers the viewer's theme. */
    --stage:#e7ddcb; --stage-ink:#645c50;
    --display:'Caprasimo', Georgia, serif;
    --body:'Figtree', system-ui, -apple-system, sans-serif;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){ --stage:#221f1a; --stage-ink:#a19786; }
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --stage:#221f1a; --stage-ink:#a19786; }
  }
  :root[data-theme="dark"]{ --stage:#221f1a; --stage-ink:#a19786; }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--stage); color:var(--ink);
    font-family:var(--body); -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:28px 16px;
  }
  .stage-note{
    font-size:12.5px; color:var(--stage-ink); letter-spacing:.02em; text-align:center;
    max-width:402px; line-height:1.5;
  }
  .stage-note b{color:var(--stage-ink); font-weight:700}

  /* ── iOS device frame ─────────────────────────────── */
  .device{
    width:402px; height:874px; max-width:100%; border-radius:48px; overflow:hidden;
    position:relative; background:var(--ground); flex:none;
    box-shadow:0 40px 80px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.12);
  }
  @media (max-height:940px){ .device{height:min(874px, calc(100vh - 120px))} }
  .island{
    position:absolute; top:11px; left:50%; transform:translateX(-50%);
    width:126px; height:37px; border-radius:24px; background:#000; z-index:50;
  }
  .statusbar{
    position:absolute; top:0; left:0; right:0; z-index:10; display:flex;
    align-items:center; justify-content:center; gap:154px;
    padding:21px 24px 19px; pointer-events:none;
  }
  .statusbar .time{
    flex:1; text-align:center; font-family:-apple-system,'SF Pro',system-ui;
    font-weight:590; font-size:17px; line-height:22px; color:#000;
  }
  .statusbar .icons{flex:1; display:flex; align-items:center; justify-content:center; gap:7px}
  .homebar{
    position:absolute; bottom:0; left:0; right:0; z-index:60; height:34px;
    display:flex; justify-content:center; align-items:flex-end; padding-bottom:8px; pointer-events:none;
  }
  .homebar i{display:block; width:139px; height:5px; border-radius:100px; background:rgba(0,0,0,.25)}

  .app{height:100%; display:flex; flex-direction:column; background:var(--ground); color:var(--ink); position:relative}
  .scroll{flex:1; overflow:auto; min-height:0; -webkit-overflow-scrolling:touch}
  .screen{padding:72px 20px 130px}

  /* ── type ─────────────────────────────────────────── */
  .d1{font-family:var(--display); font-size:22px; line-height:1.1}
  .d2{font-family:var(--display); font-size:20px}
  .d3{font-family:var(--display); font-size:18px}
  .kicker{font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--n600)}

  /* ── controls ─────────────────────────────────────── */
  button{font-family:var(--body); cursor:pointer}
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--gold-700); outline-offset:2px; border-radius:999px;
  }
  .pill{border:none; border-radius:999px; display:inline-flex; align-items:center; justify-content:center}
  .card{background:var(--surface); border-radius:28px; box-shadow:0 1px 2px rgba(46,43,37,.14)}
  .row{display:flex; align-items:center}

  .primary{
    width:100%; border:none; background:var(--gold); color:#fff; border-radius:999px;
    padding:16px; font-weight:700; font-size:16px; box-shadow:0 3px 10px rgba(46,43,37,.16);
    transition:background .15s;
  }
  .primary:hover{background:var(--gold-600)} .primary:active{background:var(--gold-700)}

  .item{
    display:flex; align-items:center; gap:13px; padding:12px 0; width:100%;
    border:none; background:none; text-align:left;
    border-bottom:1px solid rgba(32,30,29,.08); cursor:pointer;
  }
  .item:hover{background:rgba(32,30,29,.02)}
  .avatar{
    width:50px; height:50px; border-radius:999px; display:flex; align-items:center;
    justify-content:center; font-family:var(--display); font-size:15px; flex:none;
  }
  .addbtn{
    width:34px; height:34px; border-radius:999px; border:none; color:#fff; font-size:20px;
    line-height:1; flex:none; display:flex; align-items:center; justify-content:center; padding-bottom:2px;
  }
  .addbtn:active{background:var(--gold-700)!important}
  .flag{
    display:inline-flex; align-items:center; gap:5px; margin-top:4px; background:var(--gold-200);
    color:var(--gold-700); border-radius:999px; padding:3px 10px; font-size:11.5px; font-weight:700;
  }

  .stepper{display:flex; align-items:center; gap:10px; background:var(--sand); border-radius:999px; padding:4px}
  .stepper button{width:28px; height:28px; border-radius:999px; border:none; background:#fff; font-size:16px; color:var(--n800)}
  .stepper span{font-weight:700; font-size:14px; min-width:14px; text-align:center; font-variant-numeric:tabular-nums}

  .chip{
    border-radius:999px; font-weight:700; cursor:pointer; border:none;
    font-size:14px; font-family:var(--body);
  }
  .toggle{
    border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600;
    font-family:var(--body); cursor:pointer;
  }

  /* ── overlays ─────────────────────────────────────── */
  .overlay{
    position:absolute; inset:0; background:rgba(32,30,29,.4); z-index:40;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .sheet{
    background:var(--surface); border-radius:28px 28px 0 0; padding:24px 22px 40px;
    animation:pgsheet .25s ease-out; max-height:78%; overflow:auto;
  }
  .toast{
    position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
    background:var(--n900); color:var(--ground); border-radius:999px; padding:11px 20px;
    font-size:13px; font-weight:600; z-index:50; white-space:nowrap;
    animation:pgtoast .22s ease-out; box-shadow:0 12px 32px rgba(46,43,37,.3);
  }
  .cartbar{position:absolute; left:16px; right:16px; bottom:104px; z-index:30}
  .nav{
    flex:none; display:flex; background:var(--surface);
    border-top:1px solid rgba(32,30,29,.1); padding:10px 8px 30px; z-index:20;
  }
  .nav button{
    flex:1; border:none; background:none; display:flex; flex-direction:column;
    align-items:center; gap:3px; padding:4px 0; position:relative;
  }
  .nav span{font-size:10.5px; font-weight:700}
  .badge{position:absolute; top:0; right:24%; width:8px; height:8px; border-radius:999px; background:var(--gold)}

  /* ── course map ───────────────────────────────────── */
  .map{
    margin-top:14px; position:relative; height:430px; border-radius:28px;
    background:var(--sage-200); overflow:hidden; box-shadow:0 1px 2px rgba(46,43,37,.14);
  }
  .blob{position:absolute; border-radius:999px; background:var(--sage-300)}
  .bunker{position:absolute; border-radius:999px; background:var(--ground)}
  .holedot{
    position:absolute; transform:translate(-50%,-50%); width:26px; height:26px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700;
    box-shadow:0 1px 2px rgba(46,43,37,.2);
  }
  .courier{transition:left .6s linear, top .6s linear}

  @keyframes pgpulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.4);opacity:0}}
  @keyframes pgtoast{from{transform:translate(-50%,14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  @keyframes pgsheet{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .pulse{animation:pgpulse 1.6s ease-out infinite}
  /* Comfortable touch targets on a handset. */
  @media (max-width: 700px){
    .addbtn{width:42px; height:42px; font-size:23px}
    .item{padding:15px 0}
    .stepper button{width:34px; height:34px}
    .nav button{padding:8px 0}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important}
  }
  ::selection{background:var(--gold-200)}

  /* ── Real phones: drop the mockup, be the app ────────────── */
  @media (max-width: 700px){
    body{display:block; padding:0; gap:0; background:var(--ground); min-height:auto}
    .stage-note{display:none}
    .device{width:100%; max-width:none; border-radius:0; box-shadow:none; height:100vh; height:100dvh}
    .island, .statusbar, .homebar{display:none}
    .screen{padding-top:calc(env(safe-area-inset-top, 0px) + 18px)}
    .nav{padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 12px)}
    .cartbar{bottom:calc(env(safe-area-inset-bottom, 0px) + 86px)}
    .toast{bottom:calc(env(safe-area-inset-bottom, 0px) + 104px)}
  }
</style>

</div>

  const mealCats = meal => (meal === 'lunch' ? LUNCH : meal === 'dinner' ? DINNER : BREAKFAST).concat(DRINKS);
  const avoided = () => S.diet.reduce((a,d) => a.concat((DIETS.find(x => x.label === d) || {avoid:[]}).avoid), []);
  function conflictsFor(item, mods){
    const av = avoided();
    const cleared = (mods || []).map(m => { const md = item.mods.find(x => x.l === m); return md && md.clears; }).filter(Boolean);
    return item.allergens.filter(a => av.indexOf(a) >= 0 && cleared.indexOf(a) < 0);
  }
  const statusIdx = p => p >= 1 ? 3 : p > 0.45 ? 2 : p > 0.15 ? 1 : 0;
  function destLabel(){
    const o = S.order; if (!o) return '';
    return o.mode === 'come' ? 'hole ' + S.hole
      : o.mode === 'hole' ? 'hole ' + o.targetHole
      : o.mode === 'turn' ? 'the halfway house' : 'the 18th green';
  }
  const initials = n => (n.split(' ').map(w => w[0]).join('').replace(/[^A-Z]/g,'').slice(0,2)) || n.slice(0,2);

  let toastTimer = null;
  function showToast(msg){
    clearTimeout(toastTimer);
    S.toast = msg; render();
    toastTimer = setTimeout(() => { S.toast = null; render(); }, 2400);
  }
  function addLine(id, qty, mods, note){
    const key = mods.join('|') + '::' + note;
    const same = S.lines.findIndex(l => l.id === id && l.mods.join('|') + '::' + l.note === key);
    if (same >= 0) S.lines[same] = Object.assign({}, S.lines[same], {qty: S.lines[same].qty + qty});
    else S.lines.push({id, qty, mods, note});
  }

  /* handler registry — rebuilt each render */
  let H = {}, hid = 0;
  const on = fn => { const k = 'h' + (++hid); H[k] = fn; return 'data-h="' + k + '"'; };
  const warnSvg = (stroke, size) =>
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+stroke+'" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 17H3z"></path><path d="M12 10v4M12 17.5v.5"></path></svg>';
  const flagSvg = (size) =>
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true"><path d="M6 21V4"></path><path d="M6 5h9l-2.5 3L15 11H6"></path></svg>';

  /* ───────── screens ───────── */
  function menuScreen(){
    const tints = [['#f7e7b8','#7a5e15'],['#e1eecc','#3d472b'],['#eee7db','#645c50']];
    let ti = 0, h = '';

    h += '<div class="screen">';
    h += '<div class="row" style="gap:12px">'
      +  '<div class="avatar" style="width:44px;height:44px;background:var(--gold);color:var(--gold-100);font-size:16px">PG</div>'
      +  '<div style="flex:1"><div class="d1">Par &amp; Grill</div>'
      +  '<div style="font-size:12.5px;color:var(--n700)">Mediterranean course bistro · 7am til late</div></div>'
      +  '<button ' + on(() => { S.holeSheet = true; render(); }) + ' class="pill" style="gap:6px;background:var(--sage-200);color:var(--sage-800);padding:9px 14px;font-size:13.5px;font-weight:600;border:none">'
      +  flagSvg(14) + ' Hole ' + S.hole + '</button></div>';

    h += '<div class="row" style="margin-top:14px;background:var(--sand);border-radius:999px;padding:4px;gap:4px">';
    [{id:'breakfast',label:'Breakfast'},{id:'lunch',label:'Lunch'},{id:'dinner',label:'Dinner'}].forEach(ml => {
      const sel = S.meal === ml.id;
      h += '<button ' + on(() => { S.meal = ml.id; render(); }) + ' class="pill" style="flex:1;padding:9px 0;background:'
        + (sel ? 'var(--gold)' : 'transparent') + ';color:' + (sel ? '#fff' : 'var(--n700)')
        + ';font-weight:700;font-size:13px">' + ml.label + '</button>';
    });
    h += '</div>';

    h += '<div class="row" style="margin-top:12px;background:var(--sage-200);border-radius:28px;padding:16px 18px;gap:12px">'
      +  '<div style="width:10px;height:10px;border-radius:999px;background:var(--sage-700);position:relative;flex:none">'
      +  '<div class="pulse" style="position:absolute;inset:0;border-radius:999px;background:var(--sage-700)"></div></div>'
      +  '<div style="font-size:13.5px;line-height:1.45;color:var(--sage-800)"><strong>We can see you on hole ' + S.hole
      +  '.</strong> Order now and we\'ll bring it to you on the course — no need to stop playing.</div></div>';

    const dietStr = S.diet.length ? S.diet.join(' · ') : 'No allergies set';
    h += '<button ' + on(() => { S.dietSheet = true; render(); }) + ' class="row" style="margin-top:10px;width:100%;gap:10px;border:1px solid var(--n300);background:var(--surface);border-radius:999px;padding:11px 16px;text-align:left">'
      +  warnSvg('#7a5e15', 15)
      +  '<span style="flex:1;font-size:13px;color:var(--n800)"><strong style="color:var(--gold-700)">' + esc(dietStr) + '</strong> — unsafe items are flagged below</span>'
      +  '<span style="font-size:12.5px;font-weight:700;color:var(--gold-700)">Edit</span></button>';

    mealCats(S.meal).forEach(cat => {
      h += '<div style="margin-top:26px"><div class="d3" style="margin-bottom:4px">' + esc(cat.name) + '</div>';
      cat.items.forEach(it => {
        const tint = tints[(ti++) % 3];
        const conflicts = conflictsFor(it, []);
        const fixable = conflicts.length > 0 && conflicts.every(a => it.mods.some(m => m.clears === a));
        const openSheet = () => { S.itemSheet = it.id; S.sheetSel = []; S.sheetNote = ''; S.sheetQty = 1; S.editLine = null; render(); };

        h += '<div ' + on(openSheet) + ' class="item" role="button" tabindex="0">'
          +  '<div class="avatar" style="background:' + tint[0] + ';color:' + tint[1] + '">' + esc(initials(it.name)) + '</div>'
          +  '<div style="flex:1;min-width:0">'
          +  '<div style="font-weight:600;font-size:15px">' + esc(it.name) + '</div>'
          +  '<div style="font-size:12.5px;color:var(--n700);margin-top:1px">' + esc(it.desc) + '</div>';
        if (conflicts.length)
          h += '<div class="flag">' + warnSvg('currentColor', 11) + ' Contains ' + esc(conflicts.join(' & ').toLowerCase()) + ' — not for you</div>';
        if (fixable)
          h += '<div style="font-size:11.5px;color:var(--sage-700);font-weight:600;margin-top:3px">Can be made safe — tap to customise</div>';
        h += '</div><div style="font-weight:600;font-size:14px">' + fmt(it.price) + '</div>'
          +  '<button aria-label="Add ' + esc(it.name) + '" ' + on(e => {
               e.stopPropagation();
               addLine(it.id, 1, [], '');
               showToast(conflicts.length

                 : it.name + ' added');
             }) + ' class="addbtn" style="background:var(--gold)">+</button></div>';
      });
      h += '</div>';
    });
    return h + '</div>';
  }

  function cartScreen(){
    const cartCount = S.lines.reduce((a,l) => a + l.qty, 0);
    const subtotal = S.lines.reduce((a,l) => a + findItem(l.id).price * l.qty, 0);

    h += '<div class="row" style="gap:10px">'

      h += '<div class="row" style="gap:10px;padding:13px 0;border-bottom:1px solid rgba(32,30,29,.07)">'

        +  '</div></div>';
    });
    if (!cartCount) h += '<div style="padding:20px 0;font-size:14px;color:var(--n600);text-align:center">Cart is empty — head back to the menu.</div>';
    h += '</div>';

    h += '<div class="d3" style="margin:24px 0 10px">Where should it go?</div><div style="display:flex;flex-direction:column;gap:9px">';

      const sel = S.mode === m.id;
      h += '<button ' + on(() => { S.mode = m.id; render(); }) + ' style="display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid '
        + (sel ? 'var(--gold)' : 'rgba(32,30,29,.1)') + ';background:' + (sel ? 'var(--gold-100)' : 'var(--surface)')
        + ';border-radius:16px;padding:13px 15px;width:100%">'
        + '<div style="width:20px;height:20px;border-radius:999px;border:2px solid ' + (sel ? 'var(--gold)' : 'var(--n400)')
        + ';background:' + (sel ? 'var(--gold)' : 'var(--surface)') + ';flex:none;margin-top:1px;box-shadow:inset 0 0 0 3px #f9f4ed"></div>'
        + '<div style="flex:1"><div style="font-weight:700;font-size:14.5px;color:var(--ink)">' + esc(m.title) + '</div>'
        + '<div style="font-size:12.5px;color:var(--n700);margin-top:2px;line-height:1.4">' + esc(m.sub) + '</div></div>'
        + '<div style="font-size:12px;font-weight:700;color:var(--gold-700)">' + m.fee + '</div></button>';
    });
    h += '</div>';

    if (S.mode === 'hole'){
      h += '<div style="margin-top:12px;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">';
      HOLES.forEach((_, i) => {
        const n = i + 1, sel = S.targetHole === n;
        h += '<button ' + on(() => { S.targetHole = n; render(); }) + ' class="chip" style="flex:none;width:40px;height:40px;background:'
          + (sel ? 'var(--gold)' : 'var(--sand)') + ';color:' + (sel ? '#fff' : 'var(--n800)') + '">' + n + '</button>';
      });
      h += '</div>';
    }

    h += '<div class="d3" style="margin:24px 0 10px">Payment</div><div style="display:flex;gap:8px">'
      +  '<button ' + on(() => { S.pay = 'apple'; render(); }) + ' class="pill" style="flex:1;border:2px solid '
      +  (S.pay === 'apple' ? 'var(--gold)' : 'rgba(32,30,29,0)') + ';background:var(--ink);color:var(--ground);padding:12px;font-weight:700;font-size:14px">Apple&nbsp;Pay</button>'
      +  '<button ' + on(() => { S.pay = 'card'; render(); }) + ' class="pill" style="flex:1;border:2px solid '
      +  (S.pay === 'card' ? 'var(--gold)' : 'rgba(32,30,29,.12)') + ';background:var(--surface);color:var(--ink);padding:12px;font-weight:700;font-size:14px">Card ·· 4021</button></div>';

    h += '<div style="margin-top:22px;border-top:1px solid rgba(32,30,29,.12);padding-top:14px;font-size:14px;display:flex;flex-direction:column;gap:7px;font-variant-numeric:tabular-nums">'
      +  '<div class="row" style="justify-content:space-between;color:var(--n700)"><span>Subtotal</span><span>' + fmt(subtotal) + '</span></div>'
      +  '<div class="row" style="justify-content:space-between;color:var(--n700)"><span>On-course delivery</span><span>' + (fee ? fmt(fee) : 'Free') + '</span></div>'
      +  '<div class="row" style="justify-content:space-between;font-weight:700;font-size:16px"><span>Total</span><span>' + fmt(subtotal + fee) + '</span></div></div>';

    h += '<button ' + on(() => {
      if (!cartCount){ showToast('Add something first'); return; }

      S.order = {num:'#214', items:oi, total:subtotal + fee, mode:S.mode, targetHole:S.targetHole, progress:0};
      S.lines = []; S.screen = 'track';
      showToast('Order in — kitchen has it');
    }) + ' class="primary" style="margin-top:16px">Place order · ' + fmt(subtotal + fee) + '</button>';

    return h + '</div>';
  }

    }
    h += '<div style="position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:var(--ground);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;white-space:nowrap">Par &amp; Grill · clubhouse</div>';
    h += '</div>';

    h += '<div class="row card" style="margin-top:12px;padding:16px 18px;gap:13px">'
      +  '<div style="width:12px;height:12px;border-radius:999px;background:var(--gold);flex:none"></div>'
      +  '<div style="flex:1;font-size:13.5px"><strong>You — hole ' + S.hole + '</strong><span style="color:var(--n700)"> · GPS live, updated just now</span></div>'
      +  '<button ' + on(() => { S.holeSheet = true; render(); }) + ' class="pill" style="border:none;background:var(--sand);color:var(--n800);padding:8px 14px;font-weight:700;font-size:12.5px">Set hole</button></div>';

    if (cartOut){
      h += '<div class="row card" style="margin-top:10px;padding:16px 18px;gap:13px">'
        +  '<div style="width:12px;height:12px;border-radius:999px;background:var(--ink);flex:none"></div>'
        +  '<div style="flex:1;font-size:13.5px"><strong>Sam — cart 2</strong><span style="color:var(--n700)"> · your order, ~' + etaMin + ' min away</span></div></div>';
    }
    return h + '</div>';
  }

  function kitchenScreen(){
    const o = S.order;
    const live = o ? [{
      num:o.num, who:GOLFER + ' M. · walking',
      hole: o.mode === 'hole' ? o.targetHole : (o.mode === 'come' ? S.hole : 0),
      items: o.items.map(i => i.qty + '× ' + i.name).join(' · '),
      note: [ o.items.filter(i => i.modsStr).map(i => i.name + ': ' + i.modsStr).join(' · '),
              S.diet.length ? 'Guest profile: ' + S.diet.join(', ') : '' ].filter(Boolean).join(' — '),
      status: statusIdx(o.progress), placed:2, live:true
    }] : [];
    const all = live.concat(S.kitchen);
    const waiting = all.filter(k => k.status < 2).length;

    let h = '<div class="screen">';
    h += '<div class="row" style="gap:10px">'
      +  '<button ' + on(() => { S.screen = 'me'; render(); }) + ' aria-label="Back" class="pill" style="width:36px;height:36px;background:var(--sand);font-size:17px;color:var(--n800);border:none">←</button>'
      +  '<div class="d1" style="flex:1">Kitchen queue</div>'
      +  '<span style="font-size:11.5px;font-weight:700;color:var(--gold-700);background:var(--gold-200);border-radius:999px;padding:5px 11px;letter-spacing:.04em">STAFF</span></div>'
      +  '<div style="font-size:13px;color:var(--n700);margin-top:6px">' + waiting + ' order' + (waiting === 1 ? '' : 's') + ' waiting · 2 carts out on course</div>';

    h += '<div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">';
    all.forEach(k => {
      h += '<div class="card" style="padding:17px 18px">'
        +  '<div class="row" style="gap:10px"><span style="font-weight:800;font-size:14px">' + k.num + '</span>'
        +  '<span style="flex:1;font-size:13.5px;color:var(--n700)">' + esc(k.who) + '</span>'
        +  '<span style="font-size:11.5px;font-weight:700;color:' + K_TAGS[k.status][1] + ';background:' + K_TAGS[k.status][0] + ';border-radius:999px;padding:4px 10px">' + K_LABELS[k.status] + '</span></div>'
        +  '<div style="font-size:14px;margin-top:9px;line-height:1.5">' + esc(k.items) + '</div>';
      if (k.note)
        h += '<div style="display:flex;gap:7px;align-items:flex-start;margin-top:8px;background:var(--gold-200);color:var(--gold-700);border-radius:16px;padding:9px 12px;font-size:12.5px;font-weight:600;line-height:1.4">'
          +  '<span style="flex:none;margin-top:1px;display:flex">' + warnSvg('currentColor', 13) + '</span><span>' + esc(k.note) + '</span></div>';
      h += '<div class="row" style="gap:8px;margin-top:12px">'
        +  '<span class="row" style="gap:5px;font-size:12.5px;font-weight:600;color:var(--sage-800);background:var(--sage-200);border-radius:999px;padding:6px 12px">'
        +  flagSvg(12) + ' ' + (k.hole ? 'Hole ' + k.hole : 'Halfway house') + '</span>'
        +  '<span style="flex:1;font-size:12.5px;color:var(--n600)">' + k.placed + ' min ago</span>';
      if (k.status < 3){
        h += '<button ' + on(() => {
          if (k.live){ S.order.progress = k.status === 0 ? 0.2 : k.status === 1 ? 0.5 : 1; }
          else { S.kitchen = S.kitchen.map(x => x.num === k.num ? Object.assign({},x,{status:x.status+1}) : x); }
          showToast(k.num + ' → ' + K_LABELS[k.status + 1]);
        }) + ' class="pill" style="border:none;background:var(--gold);color:#fff;padding:9px 16px;font-weight:700;font-size:12.5px">' + K_BTNS[Math.min(k.status, 2)] + '</button>';
      }
      h += '</div></div>';
    });
    return h + '</div></div>';
  }

  function meScreen(){
    const dietStr = S.diet.length ? S.diet.join(' · ') : 'No allergies set';
    let h = '<div class="screen">';
    h += '<div class="row" style="gap:14px">'
      +  '<div class="avatar" style="width:56px;height:56px;background:var(--gold-200);color:var(--gold-700);font-size:20px">' + GOLFER[0] + '</div>'
      +  '<div><div class="d1">' + GOLFER + '</div>'
      +  '<div style="font-size:12.5px;color:var(--n700)">Fairway Club member · 14 orders</div></div></div>';

    h += '<div class="row" style="margin-top:18px;background:var(--sage-200);border-radius:28px;padding:16px 18px;gap:12px">'
      +  '<div style="flex:1"><div class="kicker" style="color:var(--sage-700)">YOUR USUAL</div>'
      +  '<div style="font-size:14px;font-weight:600;color:#272e1b;margin-top:3px">Greek Frappe + Halloumi &amp; Egg Roll (no egg)</div></div>'
      +  '<button ' + on(() => {
           S.lines = [{id:'frappe',qty:1,mods:[],note:''},{id:'halou',qty:1,mods:['No egg'],note:''}];
           S.screen = 'cart'; showToast('Your usual, added');
         }) + ' class="pill" style="border:none;background:var(--sage);color:var(--sage-100);padding:10px 18px;font-weight:700;font-size:13px">Reorder</button></div>';

    h += '<div class="row card" style="margin-top:12px;padding:14px 18px;gap:12px;box-shadow:none">'
      +  '<div style="flex:1"><div class="kicker">ALLERGIES &amp; DIET</div>'
      +  '<div style="font-size:13.5px;font-weight:600;margin-top:3px;color:var(--gold-700)">' + esc(dietStr) + '</div>'
      +  '<div style="font-size:12px;color:var(--n600);margin-top:2px">Flags unsafe menu items · sent to the kitchen with every order</div></div>'
      +  '<button ' + on(() => { S.dietSheet = true; render(); }) + ' class="pill" style="border:none;background:var(--sand);color:var(--n800);padding:8px 14px;font-weight:700;font-size:12.5px">Edit</button></div>';

    h += '<div class="d3" style="font-size:17px;margin:22px 0 8px">Recent orders</div><div class="card" style="padding:4px 18px;box-shadow:none">';
    HISTORY.forEach(ho => {
      h += '<div class="row" style="gap:10px;padding:13px 0;border-bottom:1px solid rgba(32,30,29,.07)">'
        +  '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">' + esc(ho.what) + '</div>'
        +  '<div style="font-size:12px;color:var(--n600);margin-top:1px">' + esc(ho.when) + '</div></div>'
        +  '<span style="font-size:13.5px;font-weight:600;color:var(--n700)">' + ho.total + '</span></div>';
    });
    h += '</div>';

    h += '<div class="card" style="margin-top:16px;padding:4px 18px;box-shadow:none">'
      +  '<div class="row" style="padding:14px 0;border-bottom:1px solid rgba(32,30,29,.07);font-size:14.5px;font-weight:500">Payment methods<span style="margin-left:auto;color:var(--n500)">›</span></div>'
      +  '<div class="row" style="padding:14px 0;border-bottom:1px solid rgba(32,30,29,.07);font-size:14.5px;font-weight:500">Notifications<span style="margin-left:auto;color:var(--n500)">›</span></div>'
      +  '<div ' + on(() => { S.screen = 'kitchen'; render(); }) + ' role="button" tabindex="0" class="row" style="padding:14px 0;font-size:14.5px;font-weight:500;cursor:pointer;color:var(--gold-700)">Kitchen — staff view<span style="margin-left:auto;color:var(--n500)">›</span></div></div>';

    return h + '</div>';
  }

  /* ───────── chrome: cart bar, nav, sheets, toast ───────── */
  function chrome(){
    const o = S.order;
    const cartCount = S.lines.reduce((a,l) => a + l.qty, 0);
    const subtotal = S.lines.reduce((a,l) => a + findItem(l.id).price * l.qty, 0);
    let h = '';

    if (S.screen === 'menu' && cartCount > 0){
      h += '<div class="cartbar"><button ' + on(() => { S.screen = 'cart'; render(); })
        +  ' style="width:100%;border:none;background:var(--ink);color:var(--ground);border-radius:999px;padding:15px 22px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;box-shadow:0 12px 32px rgba(46,43,37,.22)">'
        +  '<span>View order · ' + cartCount + ' item' + (cartCount === 1 ? '' : 's') + '</span><span>' + fmt(subtotal) + '</span></button></div>';
    }

    h += '<div class="nav">';
    TAB_DEFS.forEach(t => {
      const active = S.screen === t.id || (t.id === 'me' && S.screen === 'kitchen') || (t.id === 'menu' && S.screen === 'cart');
      const badge = t.id === 'track' && !!o && o.progress < 1;
      h += '<button ' + on(() => { S.screen = t.id; render(); }) + ' style="color:' + (active ? 'var(--gold)' : 'var(--n600)') + '"'
        +  (active ? ' aria-current="page"' : '') + '>'
        +  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        +  '<path d="' + t.d1 + '"></path><path d="' + t.d2 + '"></path></svg>'
        +  '<span>' + t.label + '</span>' + (badge ? '<span class="badge"></span>' : '') + '</button>';
    });
    h += '</div>';

    /* item customise sheet */
    if (S.itemSheet){
      const it = findItem(S.itemSheet);
      const editing = S.editLine !== null;
      const conf = conflictsFor(it, S.sheetSel);
      const hadConf = conflictsFor(it, []).length > 0;
      const warn = conf.length
        ? 'Contains ' + conf.join(' & ').toLowerCase() + ' — your profile flags this. Pick a swap below or skip it.'
        : (hadConf ? 'Sorted — safe with your changes.' : '');

      h += '<div class="overlay" ' + on(() => { S.itemSheet = null; S.editLine = null; render(); }) + '>'
        +  '<div class="sheet" ' + on(e => e.stopPropagation()) + '>'
        +  '<div class="row" style="align-items:baseline;justify-content:space-between">'
        +  '<div class="d2">' + esc(it.name) + '</div><div style="font-weight:700;font-size:15px">' + fmt(it.price) + '</div></div>'
        +  '<div style="font-size:13px;color:var(--n700);margin-top:3px">' + esc(it.desc) + '</div>';
      if (warn)
        h += '<div style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;background:' + (conf.length ? 'var(--gold-200)' : 'var(--sage-200)')
          +  ';color:' + (conf.length ? 'var(--gold-700)' : 'var(--sage-800)') + ';border-radius:16px;padding:11px 14px;font-size:13px;font-weight:600;line-height:1.4">'
          +  '<span style="flex:none;margin-top:1px;display:flex">' + warnSvg('currentColor', 14) + '</span><span>' + esc(warn) + '</span></div>';

      h += '<div class="kicker" style="margin:16px 0 8px">SWAPS &amp; REMOVALS</div><div style="display:flex;flex-wrap:wrap;gap:8px">';
      it.mods.forEach(m => {
        const sel = S.sheetSel.indexOf(m.l) >= 0;
        h += '<button ' + on(() => {
            S.sheetSel = sel ? S.sheetSel.filter(x => x !== m.l) : S.sheetSel.concat([m.l]); render();
          }) + ' class="toggle" aria-pressed="' + sel + '" style="border:2px solid ' + (sel ? 'var(--gold)' : 'var(--n300)')
          + ';background:' + (sel ? 'var(--gold-200)' : 'var(--surface)') + ';color:' + (sel ? 'var(--gold-700)' : 'var(--n800)') + '">' + esc(m.l) + '</button>';
      });
      if (!it.mods.length) h += '<div style="font-size:13px;color:var(--n600)">No swaps on this one.</div>';
      h += '</div>';

      h += '<div class="kicker" style="margin:16px 0 8px">NOTE FOR THE KITCHEN</div>'
        +  '<input id="note" value="' + esc(S.sheetNote) + '" placeholder="e.g. severe allergy — separate prep please" '
        +  'style="width:100%;border:1px solid var(--n300);background:#fff;border-radius:999px;padding:12px 16px;font-family:var(--body);font-size:14px;color:var(--ink);outline:none">';

      h += '<div class="row" style="gap:12px;margin-top:16px">'
        +  '<div class="stepper" style="padding:5px">'
        +  '<button aria-label="One fewer" ' + on(() => { S.sheetQty = Math.max(1, S.sheetQty - 1); render(); }) + ' style="width:32px;height:32px;font-size:17px">−</button>'
        +  '<span style="font-size:15px;min-width:16px">' + S.sheetQty + '</span>'
        +  '<button aria-label="One more" ' + on(() => { S.sheetQty = S.sheetQty + 1; render(); }) + ' style="width:32px;height:32px;font-size:17px">+</button></div>'
        +  '<button ' + on(() => {
             const mods = S.sheetSel.slice(), note = S.sheetNote.trim();
             let msg;
             if (editing){
               S.lines[S.editLine] = { id:S.itemSheet, qty:S.sheetQty, mods:mods, note:note };
               msg = it.name + ' updated';
             } else {
               addLine(S.itemSheet, S.sheetQty, mods, note);
               msg = conf.length
                 ? 'Still contains ' + conf.join(' & ').toLowerCase() + ' — added with a kitchen flag'
                 : (mods.length || note) ? it.name + ' added — noted for the kitchen'
                 : it.name + ' added';
             }
             S.itemSheet = null; S.editLine = null;
             showToast(msg);
           }) + ' class="primary" style="flex:1;padding:14px;font-size:15px;box-shadow:none">'
        +  (editing ? 'Save changes · ' : 'Add to order · ') + fmt(it.price * S.sheetQty) + '</button></div>'
        +  (editing
             ? '<button ' + on(() => {
                 S.lines.splice(S.editLine, 1);
                 S.itemSheet = null; S.editLine = null;
                 showToast(it.name + ' removed');
               }) + ' style="margin-top:10px;width:100%;border:none;background:none;color:var(--n700);font-size:13.5px;font-weight:700;padding:10px;text-decoration:underline">Remove from order</button>'
             : '');

      h += '</div></div>';
    }

    /* diet sheet */
    if (S.dietSheet){
      h += '<div class="overlay" ' + on(() => { S.dietSheet = false; render(); }) + '>'
        +  '<div class="sheet" style="padding-bottom:44px" ' + on(e => e.stopPropagation()) + '>'
        +  '<div class="d2" style="font-size:19px">Allergies &amp; diet</div>'
        +  '<div style="font-size:13px;color:var(--n700);margin:5px 0 14px">Pick what applies. Menu items you can\'t eat get flagged, and the kitchen sees this with every order.</div>'
        +  '<div style="display:flex;flex-wrap:wrap;gap:8px">';
      DIETS.forEach(d => {
        const sel = S.diet.indexOf(d.label) >= 0;
        h += '<button ' + on(() => {
            S.diet = sel ? S.diet.filter(x => x !== d.label) : S.diet.concat([d.label]); render();
          }) + ' class="toggle" aria-pressed="' + sel + '" style="padding:9px 15px;font-size:13.5px;border:2px solid ' + (sel ? 'var(--gold)' : 'var(--n300)')
          + ';background:' + (sel ? 'var(--gold-200)' : 'var(--surface)') + ';color:' + (sel ? 'var(--gold-700)' : 'var(--n800)') + '">' + d.label + '</button>';
      });
      h += '</div><button ' + on(() => { S.dietSheet = false; render(); }) + ' class="primary" style="margin-top:16px;padding:13px;font-size:14px;box-shadow:none">Done</button></div></div>';
    }

    /* hole sheet */
    if (S.holeSheet){
      h += '<div class="overlay" ' + on(() => { S.holeSheet = false; render(); }) + '>'
        +  '<div class="sheet" style="padding-bottom:44px" ' + on(e => e.stopPropagation()) + '>'
        +  '<div class="d2" style="font-size:19px">Where are you?</div>'
        +  '<div style="font-size:13px;color:var(--n700);margin:5px 0 16px">GPS puts you on hole ' + S.gpsHole + '. Override it if we\'ve got it wrong.</div>'
        +  '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:9px">';
      HOLES.forEach((_, i) => {
        const n = i + 1, sel = S.hole === n;
        h += '<button ' + on(() => { S.hole = n; S.holeSheet = false; showToast('Position set to hole ' + n); }) + ' class="chip" style="height:44px;font-size:15px;background:'
          + (sel ? 'var(--gold)' : 'var(--sand)') + ';color:' + (sel ? '#fff' : 'var(--n800)') + '">' + n + '</button>';
      });
      h += '</div><button ' + on(() => { S.hole = S.gpsHole; S.holeSheet = false; showToast('Using live GPS — hole ' + S.gpsHole); })
        +  ' class="pill" style="margin-top:14px;width:100%;border:2px solid var(--gold);background:none;color:var(--gold-700);padding:12px;font-weight:700;font-size:14px">Use my GPS position</button>'
        +  '</div></div>';
    }

    if (S.toast) h += '<div class="toast" role="status">' + esc(S.toast) + '</div>';
    return h;
  }

  /* ───────── render ───────── */
  const scrollEl = document.getElementById('scroll');
  const chromeEl = document.getElementById('chrome');
  const scrollTops = {};
  let lastScreen = null;

  function render(){
    if (lastScreen === S.screen) scrollTops[S.screen] = scrollEl.scrollTop;

    /* preserve the kitchen note field across re-renders */
    const noteEl = document.getElementById('note');
    const noteFocused = noteEl && document.activeElement === noteEl;
    const caret = noteFocused ? noteEl.selectionStart : null;

    H = {}; hid = 0;
    const body =
      S.screen === 'menu'   ? menuScreen()   :
      S.screen === 'cart'   ? cartScreen()   :
      S.screen === 'track'  ? trackScreen()  :
      S.screen === 'course' ? courseScreen() :
      S.screen === 'kitchen'? kitchenScreen():
                              meScreen();

    scrollEl.innerHTML = body;
    chromeEl.innerHTML = chrome();

    scrollEl.scrollTop = lastScreen === S.screen ? (scrollTops[S.screen] || 0) : 0;
    lastScreen = S.screen;

    const fresh = document.getElementById('note');
    if (fresh && noteFocused){ fresh.focus(); try { fresh.setSelectionRange(caret, caret); } catch(e){} }
  }

  /* one delegated listener for the whole app */
  function dispatch(e){
    const t = e.target.closest('[data-h]');
    if (!t) return;
    if (e.type === 'keydown'){
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (t.tagName === 'BUTTON' || t.tagName === 'INPUT') return; /* native */
      e.preventDefault();
    }
    const fn = H[t.getAttribute('data-h')];
    if (fn) fn(e);
  }
  document.addEventListener('click', dispatch);
  document.addEventListener('keydown', dispatch);
  document.addEventListener('input', e => { if (e.target.id === 'note') S.sheetNote = e.target.value; });

  /* Order auto-advances, same cadence as the design. Re-rendering replaces
     the whole screen, so only do it when the visible screen actually shows
     order progress and no sheet is open — otherwise a redraw landing between
     finger-down and finger-up swallows the tap. */
  setInterval(() => {
    const o = S.order;
    if (!o || o.progress >= 1) return;
    o.progress = Math.min(1, o.progress + 0.016);
    const done = o.progress >= 1;
    if (S.itemSheet || S.dietSheet || S.holeSheet) return;
    if (done) { showToast('Delivered — enjoy out there!'); return; }
    if (S.screen === 'track' || S.screen === 'course' || S.screen === 'kitchen') render();
  }, 600);

  render();
})();
</script>

</body>
</html>
